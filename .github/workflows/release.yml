name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # A release ships the browser bundle prebuilt; the server runs source.
      - run: pnpm build
      - run: pnpm exec tsx scripts/release-pack.ts "${GITHUB_REF_NAME}" .artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file .artifacts/NOTES.md \
            ".artifacts/gizmo-${GITHUB_REF_NAME}.tar.gz" \
            .artifacts/SHA256SUMS
